; 花房项目 · 固件构建配置（2026-10-24 建，AR16 P0-1）
; 用途：锁定板型、框架版本与依赖库版本，保证可复现
; 用法（源码不在默认 src/，须显式指定目录）：
;   pio run -e greenhouse --project-dir "outputs/代码/花房代码/GreenHouse_v1"
;   （或在下方 [platformio] 段加 src_dir 指到该目录；当前团队主用 arduino-cli，见 AGENTS §4）
; 若用 arduino-cli 而非 PlatformIO，见下面 Arduino 库版本注释
[env:greenhouse]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/DHT sensor library@^1.4.7
    olikraus/U8g2@^2.36.19
    adafruit/Adafruit Unified Sensor@^1.1.15
    knolleary/PubSubClient@^2.8
; arduino-cli 等价命令：
;   arduino-cli lib install "DHT sensor library@1.4.7"
;   arduino-cli lib install "U8g2@2.36.19"
;   arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
;   arduino-cli lib install "PubSubClient@2.8"
;
; 板型：esp32:esp32:esp32（经典 ESP32 Dev Module）
; ⚠️ 本文件从未经 pio run 实测验证（AR18 起标注，至今未跑）；团队主用 arduino-cli，见 AGENTS §4。
;    PlatformIO 的 espressif32 平台版本与 arduino-cli 的 esp32:esp32@3.3.12 不是同一发行渠道，
;    若要用 pio run，须先实测 platform 版本与 core 3.x 适配（U8g2 显式 SCL/SDA、I2C 100kHz）。
; 编译占用实测（arduino-cli，v1.9 全开）：≈1.12MB / 85% Flash。
