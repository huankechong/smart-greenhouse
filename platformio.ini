; 花房项目 · 固件构建配置（2026-10-24 建，AR16 P0-1）
; 用途：锁定板型、框架版本与依赖库版本，保证可复现
; 用法：
;   pio run -e greenhouse          # 编译
;   pio run -e greenhouse -t upload
; 若用 arduino-cli 而非 PlatformIO，见下面 Arduino 库版本注释
[env:greenhouse]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/DHT sensor library@^1.4.7
    olikraus/U8g2@^2.36.19
    adafruit/Adafruit Unified Sensor@^1.1.15
    knolleary/PubSubClient@^2.8
; arduino-cli 等价命令：
;   arduino-cli lib install "DHT sensor library@1.4.7"
;   arduino-cli lib install "U8g2@2.36.19"
;   arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
;   arduino-cli lib install "PubSubClient@2.8"
;
; 板型：esp32:esp32:esp32（经典 ESP32 Dev Module）
; 编译占用实测（AR16）：全开关 902KB(68%) / RAM 47KB(14%)
